name: aftercare-agent-workbench-langchain
services:
  db:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: aftercare_demo
      POSTGRES_USER: aftercare
      POSTGRES_PASSWORD: aftercare_local_only
    ports:
      - "127.0.0.1:${AFTERCARE_DB_PORT:-55435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aftercare -d aftercare_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"
  app:
    profiles: [app]
    build: .
    image: aftercare-agent-workbench-langchain:local
    environment:
      APP_ENV: local
      ALLOW_REAL_MODEL_CALLS: "false"
      # Explicit local demonstration switches; staff credentials are provisioned via CLI.
      DEMO_LOGIN_ENABLED: "${DEMO_LOGIN_ENABLED:-false}"
      WAREHOUSE_SIMULATION_ENABLED: "${WAREHOUSE_SIMULATION_ENABLED:-false}"
      # Same-host Unix socket keeps the strict offline network guard intact.
      DATABASE_URL: "postgresql+psycopg://aftercare:aftercare_local_only@/aftercare_demo?host=/var/run/postgresql"
    volumes:
      - pgsocket:/var/run/postgresql:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AFTERCARE_PORT:-8130}:8000"
    command: ["python", "-m", "aftercare", "serve", "--offline", "--container-network"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
    restart: "no"
  worker:
    profiles: [app]
    image: aftercare-agent-workbench-langchain:local
    build: .
    environment:
      APP_ENV: local
      ALLOW_REAL_MODEL_CALLS: "false"
      DATABASE_URL: "postgresql+psycopg://aftercare:aftercare_local_only@/aftercare_demo?host=/var/run/postgresql"
    volumes:
      - pgsocket:/var/run/postgresql:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "aftercare", "worker", "--provider", "scripted"]
    restart: "no"
volumes:
  pgdata:
  pgsocket:
